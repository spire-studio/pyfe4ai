name: Tests

# push only for main and release tags: a commit on a pull request's branch is
# tested once, through pull_request (on the merge with the base branch)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The suites of core-release and rust-native run under pytest-xdist: -n auto
# starts one worker per vCPU (4 on ubuntu-latest), and --dist worksteal hands
# the queued tests of a busy worker to idle ones (the longest test alone takes
# about a minute). The outcome of every test is that of a serial run; xdist
# only leaves out of its summary the modules skipped at collection and the
# tests deselected by -m. full-research stays serial.
jobs:
  core-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: pyfe4ai
          environment-file: environment.yml
          auto-activate-base: false

      # the dependencies are those of pyproject.toml; this lane tests the
      # Python implementation, so the native extension is not built
      - name: Install the package with test extras
        shell: bash -l {0}
        env:
          PYFE4AI_NO_NATIVE: "1"
        run: |
          python -m pip install -e ".[test]" "pytest-xdist>=3.8"

      - name: Run core release test suite
        shell: bash -l {0}
        run: |
          python -m pytest -m core -q -n auto --dist worksteal

  # Native backend lane: every entry builds the Rust extension
  # pyfe4ai._rust_native (pip install runs tools/build_rust.py through
  # setup.py when cargo is on the PATH) and the C ABI of rust/core. The two
  # native entries run `cargo test` in rust/core and the full suite on the
  # native backend: Python 3.10 (the minimum of requires-python) with one
  # thread, Python 3.13 with 4 threads per native call. The Python-backend
  # entry runs the full suite with PYFE4AI_BACKEND=python, the reference
  # implementation the native code must match bit for bit, on Python 3.10 on
  # a runner of its own, in parallel with the native suites; it needs the
  # extension and the C ABI too, since some of its tests run the native code
  # and compare it with the Python one.
  # The pairing tests run on BLS12-381 from the extension (no charm needed).
  rust-native:
    name: rust-native (Python ${{ matrix.python-version }}${{ matrix.backend == 'python' && ', Python backend' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            backend: native
            threads: "1"
          - python-version: "3.13"
            backend: native
            threads: "4"
          - python-version: "3.10"
            backend: python
    env:
      CARGO_TERM_COLOR: always
      # every cargo build of this job (pip install through tools/build_rust.py,
      # cargo test, the C ABI) uses thin LTO and 16 codegen units: about half
      # the build time of the release profiles in the Cargo.toml files
      # (rust/native: fat LTO, 1 codegen unit). The results must be the same.
      # Release builds and the constant-time measurements use those profiles.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          # the two crates are separate workspaces; the extension's build
          # depends on the interpreter, hence the Python version in the key
          # (the two Python 3.10 entries build the same and share one cache).
          # It keeps only the dependencies: the two crates of this repository
          # are compiled in every job, which is most of the build time
          workspaces: |
            rust/core -> target
            rust/native -> target
          key: py${{ matrix.python-version }}

      - name: Install the package with test extras (builds the extension)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "pytest-xdist>=3.8"

      - name: Check that the native extension was built
        # setup.py treats the extension as optional and only warns when the
        # build fails; this lane must not fall back to Python silently
        run: |
          python -c "from pyfe4ai import backend as nb; assert nb.available(), 'pyfe4ai._rust_native was not built'; print(nb.describe())"

      - name: cargo test (rust/core)
        if: ${{ matrix.backend == 'native' }}
        working-directory: rust/core
        run: cargo test --release --locked

      - name: Build the rust/core C ABI (loaded by tests/native/test_rust_core.py)
        working-directory: rust/core
        run: cargo build --release --locked

      - name: Full test suite, native backend
        if: ${{ matrix.backend == 'native' }}
        env:
          PYFE4AI_BACKEND: native
          PYFE4AI_THREADS: ${{ matrix.threads }}
        run: python -m pytest -q -rs -n auto --dist worksteal

      - name: Full test suite, Python backend
        if: ${{ matrix.backend == 'python' }}
        env:
          PYFE4AI_BACKEND: python
        run: python -m pytest -q -n auto --dist worksteal

  # Pairing-enabled full suite compiles PBC + charm-crypto from source and is
  # slower/more fragile than the core lane, so it only runs on manual dispatch
  # (Actions -> Tests -> Run workflow), typically before a release. The full
  # suite runs the pairing tests on BLS12-381 (the default group, from the
  # Rust extension, which pip builds with the runner's cargo); the last step
  # runs them again on a charm-crypto curve.
  full-research:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgmp-dev \
            libfl-dev \
            libssl-dev \
            flex \
            bison \
            wget \
            m4

      - name: Build and install PBC
        # the SHA-256 of the archive, as in docker/Dockerfile.pairing; the
        # Internet Archive copy when crypto.stanford.edu does not answer, and
        # Ubuntu's libpbc-dev (PBC 0.5.14) when neither gives that archive
        run: |
          for url in \
            https://crypto.stanford.edu/pbc/files/pbc-1.0.0.tar.gz \
            https://web.archive.org/web/2020id_/https://crypto.stanford.edu/pbc/files/pbc-1.0.0.tar.gz
          do
            rm -f pbc-1.0.0.tar.gz
            if wget -q --timeout=30 --tries=2 -O pbc-1.0.0.tar.gz "$url" &&
               echo "18275a367283077bafe35f443200499e3b19c4a3754953da2a1b2f0d6b5922dc  pbc-1.0.0.tar.gz" | sha256sum -c -; then
              echo "PBC 1.0.0 from $url"
              tar -xzf pbc-1.0.0.tar.gz
              cd pbc-1.0.0
              ./configure
              make
              sudo make install
              sudo ldconfig
              exit 0
            fi
          done
          echo "PBC 1.0.0 not available; installing Ubuntu's libpbc-dev"
          sudo apt-get install -y libpbc-dev
          dpkg -s libpbc-dev | grep '^Version'

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: pyfe4ai
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install project with test and pairing extras
        shell: bash -l {0}
        run: |
          python -m pip install -e ".[test,pairing]"

      - name: Run full research test suite
        shell: bash -l {0}
        run: |
          python -m pytest -q

      - name: Check that charm-crypto provides MNT224
        # otherwise the pairing test modules would all skip and the next step pass
        shell: bash -l {0}
        run: |
          python -c "from pyfe4ai.primitives.pairing.pairing_backend import pairing_available; assert pairing_available('MNT224'), 'charm-crypto does not provide MNT224'"

      - name: Pairing tests on a charm-crypto curve (MNT224)
        shell: bash -l {0}
        env:
          PYFE4AI_TEST_PAIRING_GROUP: MNT224
        run: |
          python -m pytest -m extended -q

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfe4ai"
version = "0.4.0"
description = "Python-based functional encryption for AI security and privacy."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Spire Studio" }
]
keywords = [
  "cryptography",
  "functional encryption",
  "inner product",
  "ai security",
  "privacy",
  "privacy-preserving machine learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "gmpy2>=2.2",  # prev_prime
  "numpy>=1.22",
]

[project.optional-dependencies]
test = [
  "pytest",
]
pairing = [
  "charm-crypto-framework",
]
dev = [
  "pytest",
]
doc = [
  "sphinx>=7",
  "furo",
  "sphinx-autodoc-typehints>=2",
]

[project.urls]
Homepage = "https://spire-studio.github.io/pyfe4ai/"
Documentation = "https://spire-studio.github.io/pyfe4ai/docs/"
Repository = "https://github.com/spire-studio/pyfe4ai"
Issues = "https://github.com/spire-studio/pyfe4ai/issues"
Changelog = "https://github.com/spire-studio/pyfe4ai/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pyfe4ai*"]

[tool.setuptools.package-data]
pyfe4ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a bare `pytest` from the repository root imports the in-tree package (and can
# resolve the warning category below) without an install
pythonpath = ["."]
# FESecurityWarning marks known-insecure schemes (none at present) and BLS12-381
# under security_profile="standard"; tests/api/test_scheme_status.py and
# tests/params/test_security_profiles.py check the warnings themselves
filterwarnings = ["ignore::pyfe4ai.core.exceptions.FESecurityWarning"]
# every mark a test carries must be registered here; tests/conftest.py adds
# core / extended, native, slow and the group of each test (see CONTRIBUTING.md)
addopts = "--strict-markers"
markers = [
  "core: every test that needs no pairing backend (the CI lane without the extension runs -m core)",
  "extended: the pairing schemes, pairing-group checks and quadratic FE (BLS12-381 from the extension, or charm)",
  "native: exercises the native code (the extension pyfe4ai._rust_native or the rust/core C ABI); skipped or not generated without it",
  "slow: 2 s or more on an Apple M2 Max in one of the suite's configurations (tests/conftest.py SLOW)",
  # the groups: one per directory of tests/ (tests/native has none: there "native" is the mark above)
  "api: tests/api -- pyfe4ai.create, the registry, the scheme status, exceptions and warnings",
  "config: tests/config -- typed configurations, the parameter cache, serialized records and versions",
  "params: tests/params -- security profiles and parameter derivation",
  "backend: tests/backend -- backend selection and interface, backend_info(), the missing-extension notice",
  "sampling: tests/sampling -- Gaussian samplers and their native kernels",
  "lattice: tests/lattice -- NTTs, LWE matrices, Ring-LWE paths, binary ciphertexts, the RNS modulus",
  "primitives: tests/primitives -- hashing, discrete logs, ristretto255, BLS12-381 and pairing groups",
  "threshold: tests/threshold -- threshold sharings, key shares, flooding",
  "offline: tests/offline -- offline / online phases and their one-time use",
  "state: tests/state -- process-wide state, fork safety, per-object caches",
  "ml: tests/ml -- the ML adapter and quantization",
  "hardening: tests/hardening -- input validation and hardening across schemes",
  "sife: tests/sife -- the single-input schemes",
  "mife: tests/mife -- the multi-input schemes",
  "mcfe: tests/mcfe -- the multi-client schemes",
  "quadratic: tests/quadratic -- quadratic FE",
  "review: tests/review -- regression tests of the crypto reviews",
]

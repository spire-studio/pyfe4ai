[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfe4ai"
version = "0.3.0"
description = "Python-based functional encryption for AI security and privacy."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Spire Studio" }
]
keywords = [
  "cryptography",
  "functional encryption",
  "inner product",
  "ai security",
  "privacy",
  "privacy-preserving machine learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "gmpy2>=2.2",  # prev_prime
  "numpy>=1.22",
  "PyYAML>=5.4",
]

[project.optional-dependencies]
test = [
  "pytest",
]
pairing = [
  "charm-crypto-framework",
]
dev = [
  "pytest",
]
doc = [
  "sphinx>=7",
  "furo",
  "sphinx-autodoc-typehints>=2",
]

[project.urls]
Homepage = "https://spire-studio.github.io/pyfe4ai/"
Documentation = "https://spire-studio.github.io/pyfe4ai/docs/"
Repository = "https://github.com/spire-studio/pyfe4ai"
Issues = "https://github.com/spire-studio/pyfe4ai/issues"
Changelog = "https://github.com/spire-studio/pyfe4ai/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pyfe4ai*"]

[tool.setuptools.package-data]
pyfe4ai = ["config.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a bare `pytest` from the repository root imports the in-tree package (and can
# resolve the warning category below) without an install
pythonpath = ["."]
# FESecurityWarning marks known-insecure schemes (none at present) and BLS12-381
# under security_profile="standard"; tests/test_scheme_status.py and
# tests/test_security_profiles.py check the warnings themselves
filterwarnings = ["ignore::pyfe4ai.core.exceptions.FESecurityWarning"]
markers = [
  "core: core FE/IPFE coverage intended for the staged core-only release lane",
  "extended: non-core pairing-heavy or quadratic FE coverage kept outside the core-only release lane",
]
